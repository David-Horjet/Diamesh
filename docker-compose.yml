version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      - API_PORT=3001
      - API_HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_PATH=/data/diamesh.db
      - QVAC_LOG_LEVEL=info
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - diamesh-data:/data
      - diamesh-uploads:/app/apps/api/uploads
      - diamesh-logs:/app/apps/api/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  diamesh-data:
  diamesh-uploads:
  diamesh-logs:
